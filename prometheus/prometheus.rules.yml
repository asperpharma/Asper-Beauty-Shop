# Recording rule: precompute avg CPU rate per job/instance/mode (5m window).
# Result metric: job_instance_mode:node_cpu_seconds:avg_rate5m

groups:
  - name: cpu-node
    rules:
      - record: job_instance_mode:node_cpu_seconds:avg_rate5m
        expr: avg by (job, instance, mode) (rate(node_cpu_seconds_total[5m]))
