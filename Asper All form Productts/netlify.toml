# Asper Beauty Shop – Netlify continuous deployment
# Branch: main (set in Netlify dashboard: Site settings → Build & deploy → Continuous deployment)

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback (also in public/_redirects; this ensures all routes serve index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optional: branch deploy settings (default branch = main for production)
# [context.production]
#   command = "npm run build"
#   publish = "dist"
