# Gemini CI — credentials check, format check, and tray test suite
# Secrets: GEMINI_API_KEY and/or GEMINI_SA_JSON (Settings → Secrets and variables → Actions)

name: Gemini CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gemini-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure Gemini credentials are set
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          GEMINI_SA_JSON: ${{ secrets.GEMINI_SA_JSON || '' }}
        run: |
          set -eo pipefail

          SA_FILE="$RUNNER_TEMP/gemini-sa.json"

          is_nonempty() {
            [ -n "$1" ] && [ "$1" != "null" ]
          }

          if ! is_nonempty "$GEMINI_API_KEY" && ! is_nonempty "$GEMINI_SA_JSON"; then
            echo "::error::Neither GEMINI_API_KEY nor GEMINI_SA_JSON is set. Please add at least one secret to proceed."
            exit 1
          fi

          if is_nonempty "$GEMINI_SA_JSON"; then
            echo "Using service account credentials"
            mkdir -p "$(dirname "$SA_FILE")"
            printf '%s' "$GEMINI_SA_JSON" > "$SA_FILE"
            chmod 600 "$SA_FILE"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$SA_FILE" >> "$GITHUB_ENV"
          else
            echo "No service account JSON provided"
          fi

          if is_nonempty "$GEMINI_API_KEY"; then
            echo "Using GEMINI_API_KEY"
          else
            echo "No GEMINI_API_KEY provided"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Check formatting
        run: deno fmt supabase/ --check

      - name: Run Gemini CLI test suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
          # Optional: add repo secrets VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY to run the tray health-check; otherwise test skips
