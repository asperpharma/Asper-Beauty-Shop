# CI: Lint and build on push/PR to main.
# Actual deployment is triggered by your host (Vercel/Netlify/Lovable) when they receive the push.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholders so CI build runs without repo secrets; set real values in your deployment platform
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PROJECT_ID: placeholder
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_TRAY_URL: https://placeholder.supabase.co/functions/v1/tray
          VITE_SITE_URL: https://www.asperbeautyshop.com
          VITE_SHOPIFY_STORE_DOMAIN: placeholder.myshopify.com
          VITE_SHOPIFY_STOREFRONT_API_TOKEN: placeholder
          VITE_SHOPIFY_API_VERSION: "2025-01"
          VITE_SHOPIFY_CHECKOUT_URL: https://placeholder.myshopify.com/cart
