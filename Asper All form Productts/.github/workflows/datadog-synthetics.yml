name: Datadog Synthetics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  synthetics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug Network & Secrets
        shell: bash
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
        run: bash .github/scripts/datadog_debug.sh

      - name: Run Datadog Synthetics
        # Pinned tag (v1 not found); use a valid release tag from DataDog/synthetics-ci-github-action
        uses: DataDog/synthetics-ci-github-action@v0.1.0
        with:
          api_key: ${{ secrets.DATADOG_API_KEY }}
          app_key: ${{ secrets.DATADOG_APP_KEY }}
          # Add your synthetic test IDs or configuration here
